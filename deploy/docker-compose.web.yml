services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      WP_API_URL: https://cms-ibesc.samatech.cloud/wp-json/wp/v2
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      SITE_URL: ${SITE_URL:-https://ibesc.samatech.cloud}
    volumes:
      - requests:/data
    networks: [front]
volumes:
  requests: {}
