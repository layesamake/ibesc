services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      WP_API_URL: ${WP_API_URL:-https://admin.ibesc.cloud/wp-json/wp/v2}
      WP_REVALIDATE_SECRET: ${WP_REVALIDATE_SECRET:-}
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      SITE_URL: ${SITE_URL:-https://ibesc.cloud}
    volumes:
      - requests:/data
    networks: [front]
volumes:
  requests: {}
